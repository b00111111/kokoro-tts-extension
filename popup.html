<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kokoro TTS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 320px; background: #fff; }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 11px; color: rgba(255,255,255,0.7); }
    #connection-status { margin-left: auto; flex-shrink: 0; }

    /* ── Body ── */
    .body { padding: 14px 16px 16px; }

    /* ── Test button row ── */
    .test-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .status-row {
      display: flex;
      justify-content: center;
    }

    /* ── Advanced section ── */
    .advanced-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 0;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      user-select: none;
    }
    .advanced-toggle:hover { color: var(--text-base); }
    .advanced-toggle .chevron { font-size: 14px; transition: transform 0.2s; }

    .advanced-section { display: none; padding-top: 12px; }
    .advanced-section.open { display: block; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toggle-label { font-size: 12px; color: #374151; }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .range-label  { font-size: 12px; color: #374151; flex: 1; }
    .range-value  { font-size: 11px; color: var(--text-muted); min-width: 30px; text-align: right; }
    input[type="range"] { width: 90px; accent-color: #818cf8; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🔊</div>
    <div class="header-text">
      <div class="header-title">Kokoro TTS</div>
      <div class="header-sub">Text-to-Speech</div>
    </div>
    <span id="connection-status" class="status-pill unconfigured">
      <span class="dot"></span>
      <span class="label">Not configured</span>
    </span>
  </div>

  <div class="body">

    <div class="section-heading">API Configuration</div>

    <div class="field">
      <label class="field-label" for="api-url">API Endpoint URL</label>
      <div class="field-row">
        <input id="api-url" class="input" type="url" placeholder="http://192.168.1.x:8000">
      </div>
      <div id="url-error" class="field-error" style="display:none">Enter a valid http(s):// URL</div>
    </div>

    <div class="test-row">
      <button id="test-btn" class="btn btn-outline btn-full">
        🔌 Test Connection
      </button>
    </div>
    <div class="status-row" id="status-row" style="margin-bottom:6px"></div>

    <div class="section-heading">Voice Selection</div>

    <div class="field">
      <label class="field-label" for="voice-select">Default Voice</label>
      <div class="field-row">
        <select id="voice-select" class="select">
          <option value="" disabled selected>— test connection first —</option>
        </select>
        <button id="refresh-voices" class="btn btn-outline btn-icon" title="Refresh voice list">↺</button>
      </div>
    </div>

    <div class="advanced-toggle" id="advanced-toggle">
      <span>Advanced Settings</span>
      <span class="chevron">▸</span>
    </div>

    <div class="advanced-section" id="advanced-section">
      <div class="toggle-row">
        <span class="toggle-label">Auto-play after synthesis</span>
        <div id="auto-play" class="toggle" role="switch" aria-checked="true" tabindex="0"></div>
      </div>
      <div class="range-row">
        <span class="range-label">Default Volume</span>
        <input id="volume" type="range" min="0" max="100" value="80">
        <span id="volume-display" class="range-value">80%</span>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
